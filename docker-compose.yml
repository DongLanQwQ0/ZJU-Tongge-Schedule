# 同格 —— 一条命令起服务
#
#   docker compose up -d --build      # 首次（会把 data/ 打进镜像并铺到卷）
#   docker compose logs -f            # 看启动横幅
#   docker compose down               # 停（卷保留，数据不丢）
#
# 数据落在命名卷 tongge-data 上，不在宿主机目录里 —— 这样容器重建、
# 换镜像版本都不会动到同学的账号与课表。

services:
  tongge:
    build:
      context: .
    image: tongge:1.0
    container_name: tongge
    restart: unless-stopped

    # ★ 根密钥：存储加密的唯一钥匙，**必须放在部署目录之外**。
    #
    # 为什么不能直接写在 environment: 里 —— 那样密钥就躺在 /opt/tongge，
    # 一旦这个目录被打包/备份/复制走，加密就等于没做。
    #
    # 生成一把（服务器上一般没装 node，用容器版）：
    #   docker run --rm node:22-alpine node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
    # 写进文件（权限 600）：
    #   KEY=$(docker run --rm node:22-alpine node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
    #   sudo install -d -m 700 /etc/tongge
    #   printf 'TONGGE_ROOT_KEY=%s\n' "$KEY" | sudo tee /etc/tongge/key.env >/dev/null
    #   sudo chmod 600 /etc/tongge/key.env
    #
    # 注意：这个文件不存在时 compose 会直接报错，服务也拒绝启动 ——
    # 那是有意的：绝不允许悄悄退化成明文存盘。
    env_file:
      - /etc/tongge/key.env

    # 左边是宿主机端口，右边是容器端口。
    #
    # 默认只绑 127.0.0.1 —— 正式服的入口是反向代理（HTTPS），容器不该直接对外。
    # 公网机器上写成 0.0.0.0:3000 的话，一旦漏配反代或防火墙，密码与会话令牌
    # 就是在网上明文跑。
    #
    # 想本机临时直连（开发、内网试跑、还没配反代）就改成 "3000:3000"，
    # 然后访问 http://localhost:3000
    ports:
      - "127.0.0.1:3560:3000"

    environment:
      TZ: Asia/Shanghai
      # 想改端口的话这里也要跟着改（服务读的是 PORT）
      PORT: "3000"
      DATA_DIR: /app/data

    volumes:
      # ★ 这一行是全部数据的归宿。删了它，容器一重建数据就没了。
      - tongge-data:/app/data

    # tini 已经在镜像入口里，信号能正常传递，stop 不会被硬杀
    stop_grace_period: 15s

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/meta').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    # 日志别无限涨（json-file 驱动）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tongge-data:
    name: tongge-data
