# 同格 —— 一条命令起服务
#
#   docker compose up -d --build      # 首次（会把 data/ 打进镜像并铺到卷）
#   docker compose logs -f            # 看启动横幅
#   docker compose down               # 停（卷保留，数据不丢）
#
# 数据落在命名卷 tongge-data 上，不在宿主机目录里 —— 这样容器重建、
# 换镜像版本都不会动到同学的账号与课表。

services:
  tongge:
    build:
      context: /opt/tongge
      dockerfile: Dockerfile
      args:
        # true  = 把现有 sessions.json 一起打包，同学不用重新登录
        # false = 干净上线，所有人重新登录一次（镜像里少一份活跃令牌）
        INCLUDE_SESSIONS: "true"
    image: tongge:1.0
    container_name: tongge
    restart: unless-stopped

    # 左边是宿主机端口，右边是容器端口。
    # 想换端口只改左边：例如 "8080:3000"
    ports:
      - "127.0.0.1:3560:3000"

    environment:
      TZ: Asia/Shanghai
      # 想改端口的话这里也要跟着改（服务读的是 PORT）
      PORT: "3000"
      DATA_DIR: /app/data

    volumes:
      # ★ 这一行是全部数据的归宿。删了它，容器一重建数据就没了。
      - tongge-data:/app/data

    # tini 已经在镜像入口里，信号能正常传递，stop 不会被硬杀
    stop_grace_period: 15s

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/meta').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    # 日志别无限涨（json-file 驱动）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tongge-data:
    name: tongge-data
